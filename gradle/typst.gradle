import java.util.Properties
import java.io.FileInputStream
import java.io.IOException

def typstVersion = "v0.13.1"

def computeTypstAsset = {
    def os = System.getProperty("os.name").toLowerCase()
    def arch = System.getProperty("os.arch").toLowerCase()

    if (os.contains("mac")) {
        // Apple Silicon vs Intel
        if (arch.contains("aarch64") || arch.contains("arm")) {
            return "typst-aarch64-apple-darwin.tar.xz"
        } else {
            return "typst-x86_64-apple-darwin.tar.xz"
        }
    } else if (os.contains("linux")) {
        // Most CI runners are x86_64; adjust if you ever see linux arm runners.
        return "typst-x86_64-unknown-linux-musl.tar.xz"
    } else {
        throw new GradleException("Unsupported OS for typst: ${os} ${arch}")
    }
}

def typstUrl = {
    def asset = computeTypstAsset()
    return "https://github.com/typst/typst/releases/download/${typstVersion}/${asset}"
}

def typstDownloadDir = { file("${project.buildDir}/typst") } // project == :app when applied from app/build.gradle
def typstTarFile     = { file("${typstDownloadDir()}/typst.tar.xz") }
def typstExtractRoot = { file("${typstDownloadDir()}/extracted") }

// Returns the directory that contains the typst executable after extraction.
// This is computed at execution time (inside doLast), not at configuration time.
def findExtractedTypstDir = {
    def root = typstExtractRoot()
    if (!root.exists()) return null
    return root.listFiles()?.find { it.isDirectory() && it.name.startsWith("typst-") }
}

tasks.register("setupTypst") {
    group = "typst"
    description = "Sets up Typst by downloading and extracting the binary."

    inputs.property("typstUrl", typstUrl())
    outputs.dir(typstExtractRoot())

    doLast {
        def extractRoot = typstExtractRoot()
        def existingDir = findExtractedTypstDir()
        def existingExe = existingDir ? new File(existingDir, "typst") : null
        if (existingExe != null && existingExe.exists()) {
            // Already present.
            return
        }

        def downloadDir = typstDownloadDir()
        if (!downloadDir.exists()) downloadDir.mkdirs()

        def tarFile = typstTarFile()

        // Download
        def url = typstUrl()
        def downloadCommand = "curl -L ${url} -o ${tarFile.absolutePath}"
        println "Executing: $downloadCommand"
        def downloadProcess = downloadCommand.execute()
        downloadProcess.waitForProcessOutput(System.out, System.err)

        if (downloadProcess.exitValue() != 0) {
            throw new GradleException("Download failed with exit code ${downloadProcess.exitValue()}")
        }

        // Ensure extract root exists
        if (!extractRoot.exists()) extractRoot.mkdirs()

        // Extract (tar will create typst-<platform>/ inside extractRoot)
        def extractCommand = "tar -xf ${tarFile.absolutePath} -C ${extractRoot.absolutePath}"
        println "Executing: $extractCommand"
        def extractProcess = extractCommand.execute()
        extractProcess.waitForProcessOutput(System.out, System.err)

        if (extractProcess.exitValue() != 0) {
            throw new GradleException("Extraction failed with exit code ${extractProcess.exitValue()}")
        }

        // Clean up
        tarFile.delete()
    }
}

tasks.register("runTypst") {
    group = "typst"
    description = "Runs the Typst executable with the first .typ file (excluding formatting.typ)."
    dependsOn("setupTypst")

    doLast {
        // Paths
        def srcDir = file("${rootDir}/docs/user_manual")
        def assetsDir = file("${rootDir}/app/src/main/assets")
        if (!assetsDir.exists()) assetsDir.mkdirs()

        // Version strings
        def pluginVersion = PLUGIN_VERSION
        def platformVersion = ATAK_VERSION

        // Find the first *.typ file excluding formatting.typ
        def typFile = fileTree(srcDir)
                .include("**/*.typ")
                .exclude("**/formatting.typ")
                .files
                .find { it.isFile() }

        if (!typFile) {
            throw new GradleException("Error: No *.typ file found in ${srcDir}")
        }

        // Update platform-version and plugin-version in the typ source
        def fileContent = typFile.text
        fileContent = fileContent.replaceAll(/platform-version: ".*?"/, "platform-version: \"${platformVersion}\"")
        fileContent = fileContent.replaceAll(/plugin-version: ".*?"/, "plugin-version: \"${pluginVersion}\"")
        typFile.text = fileContent

        // Locate extracted typst directory
        def extractedDir = findExtractedTypstDir()
        if (!extractedDir) {
            throw new GradleException("Typst extracted directory not found under ${typstExtractRoot()}. Did setupTypst run?")
        }

        def extractedExe = new File(extractedDir, "typst")
        if (!extractedExe.exists()) {
            throw new GradleException("Typst executable not found at ${extractedExe.absolutePath}")
        }

        // If system typst exists and is runnable, you could prefer it, but keeping behavior simple:
        def typstExecutable = extractedExe.absolutePath

        // Run typst compile
        def outPdf = new File(assetsDir, "usermanual.pdf")
        def typstCommand = [
                typstExecutable, "compile",
                "--root", "${rootDir}",
                "--font-path", "${srcDir}",
                "${typFile.absolutePath}",
                "${outPdf.absolutePath}"
        ]

        println "Running command: ${typstCommand}"
        def process = typstCommand.execute()
        process.waitForProcessOutput(System.out, System.err)

        if (process.exitValue() != 0) {
            throw new GradleException("Error: typst command failed with exit code ${process.exitValue()}")
        }
    }
}

// Only runs by default on the official ATAK release pipeline.
if (System.getenv("ATAK_CI") == "1") {
    println("running typst to generate the user manual")
    android.applicationVariants.all { variant ->
        variant.mergeResourcesProvider.configure {
            dependsOn(tasks.named("runTypst"))
        }
    }
} else {
    println("skipping user manual generation")
}